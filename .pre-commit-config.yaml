repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.12.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9.0
          - sqlalchemy>=2.0.35
          - fastapi>=0.115.0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: local
    hooks:
      - id: forbid-runtime-artifacts
        name: Block runtime DB, coverage, data, and test-results artifacts
        entry: Runtime artifacts (*.db, .coverage, data/, test-results/) must not be committed
        language: fail
        files: '(^|/)(.*\.db|\.coverage|data/|test-results/)'
