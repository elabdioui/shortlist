[project]
name = "shortlist"
version = "0.1.0"
description = "Open-source, self-hosted AI CV screening tool with verifiable evidence citations."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Shortlist Contributors" },
]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy>=2.0.35,<3.0.0",
  "alembic>=1.13.3,<2.0.0",
  "typer>=0.12.5,<1.0.0",
  "pymupdf>=1.24.0,<2.0.0",
  "pdfplumber>=0.11.0,<1.0.0",
  "python-docx>=1.1.0,<2.0.0",
  "pytesseract>=0.3.13,<1.0.0",
  "pillow>=10.0.0,<12.0.0",
  "presidio-analyzer>=2.2.0,<3.0.0",
  "presidio-anonymizer>=2.2.0,<3.0.0",
  "spacy>=3.7.0,<4.0.0",
  "cryptography>=43.0.0,<47.0.0",
  "rapidfuzz>=3.9.0,<4.0.0",
  "litellm>=1.50.0,<2.0.0",
  "argon2-cffi>=23.1.0,<26.0.0",
  "openpyxl>=3.1.5,<4.0.0",
  "python-multipart>=0.0.12,<1.0.0",
]

[project.scripts]
shortlist = "shortlist.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "httpx>=0.27.2,<1.0.0",
  "ruff>=0.7.0,<1.0.0",
  "mypy>=1.12.0,<2.0.0",
  "vcrpy>=6.0.0,<8.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/shortlist"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["shortlist"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
  "fitz",
  "fitz.*",
  "pdfplumber",
  "pdfplumber.*",
  "docx",
  "docx.*",
  "pytesseract",
  "pytesseract.*",
  "presidio_analyzer",
  "presidio_analyzer.*",
  "presidio_anonymizer",
  "presidio_anonymizer.*",
  "spacy",
  "spacy.*",
  "litellm",
  "litellm.*",
  "vcr",
  "vcr.*",
  "openpyxl",
  "openpyxl.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
